# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: ci-test 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: Test  
    runs-on: ubuntu-latest

    steps:
    # 1. 使用最新的 v4 版本拉取你的代码
    - name: Check out code
      uses: actions/checkout@v4

    # 2. 使用最新的 v4 版本配置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.5' # 建议：打开你项目根目录的 go.mod 文件，把这里的 1.20 改成和你本地一致的版本

    # 3. 采用视频教程里的指令运行测试
    - name: Test
      run: make test